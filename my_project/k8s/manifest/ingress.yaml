# Ingress resource for the application
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pathaks-hostel-ingress
  annotations:
    # This annotation was present in your screenshot
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  # Explicitly setting the ingress class to nginx as shown in your image
  ingressClassName: nginx
  rules:
  - host: pathaks-hostel.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            # Matches the Service we created earlier
            name: pathaks-hostel-service
            port:
              # Connects to the external port of the Service
              number: 80