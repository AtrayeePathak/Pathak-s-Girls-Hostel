name: CI/CD

# Exclude the workflow to run on changes to the helm chart
on:
  push:
    branches:
      - main
    paths-ignore:
      # ⚠️ Updated paths to include 'my_project/'
      - 'my_project/helm/**'
      - 'my_project/k8s/**'
      - 'README.md'

jobs:
  # 1. Build and Push Docker Image
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push action
      uses: docker/build-push-action@v6
      with:
        # ⚠️ CHANGE: Point to your 'my_project' folder
        context: ./my_project
        file: ./my_project/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/pathaks-hostel:${{github.run_id}}

  # 2. Update Helm Chart with New Image Tag
  update-newtag-in-helm-chart:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.TOKEN }}

    - name: Update tag in Helm chart
      run: |
        # ⚠️ CHANGE: Added 'my_project/' to the path
        sed -i 's/tag: .*/tag: "${{github.run_id}}"/' my_project/helm/my-project-chart/values.yaml

    - name: Commit and push changes
      run: |
        git config --global user.email "atrayee@example.com"
        git config --global user.name "Atrayee Pathak"
        # ⚠️ CHANGE: Added 'my_project/' to the path
        git add my_project/helm/my-project-chart/values.yaml
        git commit -m "Update tag in Helm chart"
        git push