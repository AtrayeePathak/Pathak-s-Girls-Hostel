name: CI/CD

# Exclude the workflow to run on changes to the helm chart
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - 'k8s/**'
      - 'README.md'

jobs:
  # 1. Build and Push Docker Image
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push action
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        # ⚠️ CHANGE: This pushes to YOUR repo with a unique ID every time
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/pathaks-hostel:${{github.run_id}}

  # 2. Update Helm Chart with New Image Tag
  update-newtag-in-helm-chart:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.TOKEN }}

    - name: Update tag in Helm chart
      run: |
        # ⚠️ CHANGE: Updated path to match YOUR 'my-project-chart' folder
        sed -i 's/tag: .*/tag: "${{github.run_id}}"/' helm/my-project-chart/values.yaml

    - name: Commit and push changes
      run: |
        git config --global user.email "atrayee@example.com"
        git config --global user.name "Atrayee Pathak"
        # ⚠️ CHANGE: Ensure this path matches your folder exactly
        git add helm/my-project-chart/values.yaml
        git commit -m "Update tag in Helm chart"
        git push
